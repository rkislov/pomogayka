services:
  pomogayka:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Помогайка
      ADDR: ":8080"
      DATABASE_URL: "file:data/pomogayka.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(ON)"
      SESSION_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      ADMIN_FULL_NAME: Администратор
    volumes:
      - pomogayka_data:/app/data

volumes:
  pomogayka_data:
