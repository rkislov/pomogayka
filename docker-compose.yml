services:
  pomogayka:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Помогайка
      ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-file:data/pomogayka.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(ON)}
      SESSION_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      ADMIN_FULL_NAME: Администратор
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JABBER_JID: ${JABBER_JID:-}
      JABBER_PASSWORD: ${JABBER_PASSWORD:-}
      JABBER_HOST: ${JABBER_HOST:-}
      JABBER_START_TLS: ${JABBER_START_TLS:-true}
      JABBER_NO_TLS: ${JABBER_NO_TLS:-false}
      JABBER_INSECURE_TLS: ${JABBER_INSECURE_TLS:-false}
    volumes:
      - pomogayka_data:/app/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: pomogayka
      POSTGRES_USER: pomogayka
      POSTGRES_PASSWORD: pomogayka
    ports:
      - "5432:5432"
    volumes:
      - pomogayka_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomogayka -d pomogayka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pomogayka_data:
  pomogayka_pg:
